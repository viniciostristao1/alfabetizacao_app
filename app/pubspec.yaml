name: alfabetizacao
description: "Primeiras Palavras — app para a criança aprender a ler (palavras por categoria e nível de sílabas)."
publish_to: 'none'

# versionName+versionCode. Ex.: 0.1.0+1 → versionName "0.1.0", versionCode 1.
# O +N (versionCode) TEM de crescer a cada release.
version: 0.39.0+68

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2       # estado (pronto p/ gamificação: moedas/troféus)
  shared_preferences: ^2.3.2     # persistência local (sem login/nuvem por enquanto)
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/habitats/mapa_animais.jpg
    - assets/habitats/mapa_mundi.jpg
    - assets/icon/logo.png
    - assets/objetos/objetos_facil.png
    - assets/objetos/objetos_medio.png
    - assets/objetos/objetos_dificil.png
    - assets/objetos/objetos_temas.png
    - assets/objetos/objetos_temas_foto.png
    - assets/alimentos/alimentos_facil.png
    - assets/alimentos/alimentos_medio.png
    - assets/alimentos/alimentos_dificil.png
    - assets/alimentos/alimentos_temas.png
    - assets/alimentos/alimentos_temas_foto.png

# Ícone do app. Arte original: assets/icon/logo_fonte.png (fundo âmbar) —
# logo.png = quadrado âmbar (legado); logo_foreground.png = arte sem o âmbar
# (recorte transparente) p/ o ícone adaptativo. Regenerar os mipmaps:
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#FDB405"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 21
