name: alfabetizacao
description: "Primeiras Palavras — app para a criança aprender a ler (palavras por categoria e nível de sílabas)."
publish_to: 'none'

# versionName+versionCode. Ex.: 0.1.0+1 → versionName "0.1.0", versionCode 1.
# O +N (versionCode) TEM de crescer a cada release.
version: 0.2.2+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2       # estado (pronto p/ gamificação: moedas/troféus)
  shared_preferences: ^2.3.2     # persistência local (sem login/nuvem por enquanto)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícone do app (livro + cartas: urso/carro/melancia, fundo âmbar). Gera os
# mipmaps após alterar a arte: `dart run flutter_launcher_icons`.
# - image_path        = ícone legado (quadrado âmbar cheio);
# - adaptive_*        = ícone adaptativo (Android 8+): fundo âmbar + arte com
#   margem (logo_foreground) para o recorte não cortar os raios/livro.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#FDA410"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 21
